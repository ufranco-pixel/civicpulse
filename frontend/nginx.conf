# ─────────────────────────────────────────────────────────────────────────────
# CivicPulse · frontend
#
# Se copia a /etc/nginx/templates/default.conf.template. El entrypoint oficial
# de la imagen aplica envsubst SOLO a las variables que empiezan por CSP_
# (NGINX_ENVSUBST_FILTER), de modo que $uri, $host y demas variables de nginx
# sobreviven intactas.
#
# Sobre la CSP: la del sistema base declaraba style-src 'self' y font-src
# 'self', y a la vez el index.html cargaba Inter desde Google Fonts. El
# navegador bloqueaba las propias fuentes del producto. Aqui se permiten
# explicitamente fonts.googleapis.com (hoja de estilo) y fonts.gstatic.com
# (los ficheros .woff2), y en connect-src los origenes de los microservicios,
# sin los cuales fetch() y EventSource fallan en silencio.
# ─────────────────────────────────────────────────────────────────────────────

server {
    # 8080 y no 80: el contenedor corre sin privilegios y los puertos por
    # debajo de 1024 requieren CAP_NET_BIND_SERVICE.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # ── Cabeceras de seguridad ───────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header X-Frame-Options           "DENY"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                 always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src ${CSP_CONNECT_SRC}; frame-src ${CSP_FRAME_SRC}; worker-src 'self' blob:; manifest-src 'self'" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    client_max_body_size 4m;

    # ── Sonda del orquestador ────────────────────────────────────────────────
    # No pasa por el fallback SPA: debe responder 200 en texto plano aunque el
    # bundle no exista.
    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ── Recursos con hash en el nombre ───────────────────────────────────────
    # Vite los versiona; su contenido nunca cambia bajo el mismo nombre.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires    7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files  $uri =404;
    }

    # ── index.html ───────────────────────────────────────────────────────────
    # Nunca en cache: es el documento que apunta al bundle nuevo tras cada
    # despliegue. Cachearlo deja a los usuarios en la version anterior.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires    off;
    }

    location = /silent-check-sso.html {
        add_header Cache-Control "no-cache" always;
        expires    off;
    }

    # ── Fallback de aplicacion de pagina unica ───────────────────────────────
    # /informes, /alertas, etc. son rutas del router: no hay fichero en disco.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
